        function getColor(node) {
            if (node.type === 'function') return '#fff';
            const id = node.id.replace('module_', '').toLowerCase();
            if (id.includes('ade') || id.includes('ocean')) return '#4CAF50';
            if (id.includes('layout') || id.includes('schematic') || id.includes('pcell')) return '#2196F3';
            if (id.includes('core') || id.includes('dfii')) return '#FF9800';
            if (id.includes('ui') || id.includes('verify') || id.includes('viva')) return '#9C27B0';
            return '#607D8B';
        }
        
        function getSize(node) {
            if (node.type === 'function') return 8;
            const count = node.function_count || 100;
            return Math.max(15, Math.min(40, Math.sqrt(count / 10) * 8));
        }
        
        const svg = d3.select("svg");
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.edges).id(d => d.id).distance(120))
            .force("charge", d3.forceManyBody().strength(-600))
            .force("center", d3.forceCenter(width/2, height/2))
            .force("collision", d3.forceCollide().radius(d => getSize(d) + 10));
        
        const defs = svg.append("defs");
        data.edges.forEach((edge, i) => {
            const color = edge.relation === 'foundation' ? '#4CAF50' : 
                         edge.relation === 'evolution' ? '#FF9800' : '#2196F3';
            defs.append("marker")
                .attr("id", `arrow-${i}`)
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 25)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", color);
        });
        
        const link = svg.append("g")
            .selectAll("line")
            .data(data.edges)
            .enter().append("line")
            .attr("stroke", d => d.relation === 'foundation' ? '#4CAF50' : 
                                   d.relation === 'evolution' ? '#FF9800' : '#2196F3')
            .attr("stroke-width", 2)
            .attr("marker-end", (d, i) => `url(#arrow-${i})`);
        
        const node = svg.append("g")
            .selectAll("g")
            .data(data.nodes)
            .enter().append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
        
        node.append("circle")
            .attr("r", d => getSize(d))
            .attr("fill", d => getColor(d));
        
        node.append("text")
            .attr("dy", d => getSize(d) + 15)
            .attr("text-anchor", "middle")
            .text(d => d.label.length > 15 ? d.label.substring(0, 15) + '...' : d.label);
        
        const tooltip = d3.select("#tooltip");
        
        node.on("mouseover", function(event, d) {
            tooltip.style("display", "block")
                .html(`<h4>${d.label}</h4><p>${d.description || ''}</p>` +
                      (d.function_count ? `<p><strong>${d.function_count}</strong> functions</p>` : ''));
        })
        .on("mousemove", function(event) {
            tooltip.style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 10) + "px");
        })
        .on("mouseout", function() {
            tooltip.style("display", "none");
        });
        
        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
